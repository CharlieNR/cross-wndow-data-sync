<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Ball — Cross-Window Experiment</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, Segoe UI, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10131b; }
  #stage { position: fixed; inset: 0; }
  #ball {
    position: absolute; width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff 0 5%, #ffe08a 12%, #ff9f1c 42%, #e45a13 100%);
    box-shadow: 0 0 18px #ff9f1c99, inset -4px -5px 8px #9c300b66;
    pointer-events: none; z-index: 2;
  }
  #panel {
    position: fixed; left: 12px; top: 12px; z-index: 5; max-width: min(390px, calc(100vw - 24px));
    padding: 11px 14px; border: 1px solid #ffffff24; border-radius: 10px;
    color: #e9edf5; background: #171c29eF; box-shadow: 0 5px 24px #0006;
    font-size: 12px; line-height: 1.45; pointer-events: none;
  }
  #panel strong { color: #fff; font-size: 13px; }
  #status { color: #a9d6ff; }
  #help { color: #aeb8ca; margin-top: 4px; }
</style>
</head>
<body>
<div id="stage"><div id="ball"></div></div>
<div id="panel">
  <strong>Single Ball</strong><br>
  <span id="status">Connecting windows…</span>
  <div id="help">Open this page in separate browser windows. Place them touching or overlapping; the ball transfers between their visible areas and bounces off uncovered edges.</div>
</div>
<script>
(() => {
  'use strict';

  // One shared ball in desktop screen coordinates. Each window is only a
  // viewport onto that shared world; no window owns a private copy of the ball.
  const WINDOWS_PREFIX = 'singleball_v2_window_';
  const BALL_KEY = 'singleball_v2_ball';
  const WINDOW_TTL_MS = 4000;
  const HEARTBEAT_MS = 350;
  const REGISTRY_READ_MS = 100;
  const BALL_WRITE_MS = 25;
  const BALL_SIZE = 34;
  const BALL_RADIUS = BALL_SIZE / 2;
  const GAP_EDGE_ALLOWANCE = 0.51; // 0.51px per edge bridges a 1px gap.
  const INITIAL_VX = 162;
  const INITIAL_VY = 116.64;
  const MAX_SPEED = 420;

  const ballElement = document.getElementById('ball');
  const statusElement = document.getElementById('status');
  const helpElement = document.getElementById('help');

  const id = 'w_' + Date.now().toString(36) + '_' +
    Math.random().toString(36).slice(2);

  let ownRect = null;
  let ownRecord = null;
  let windows = [];
  let ballState = null;
  let wasHost = false;
  let lastHeartbeat = 0;
  let lastRegistryRead = 0;
  let lastBallWrite = 0;
  let lastStatusUpdate = 0;
  let lastFocusState = null;

  function viewportRect() {
    // Match the original multiball experiment: every window reports screenX/Y
    // and its inner viewport size in the same shared screen coordinate system.
    return {
      x: window.screenX,
      y: window.screenY,
      w: window.innerWidth,
      h: window.innerHeight
    };
  }

  function publishSelf(force = false) {
    const now = Date.now();
    const rect = viewportRect();
    const focused = document.hasFocus();
    const visible = document.visibilityState !== 'hidden';
    const geometryChanged = !ownRect ||
      rect.x !== ownRect.x || rect.y !== ownRect.y ||
      rect.w !== ownRect.w || rect.h !== ownRect.h;
    const focusChanged = focused !== lastFocusState;

    if (!force && !geometryChanged && !focusChanged &&
        now - lastHeartbeat < HEARTBEAT_MS) return;

    const focusedAt = focused
      ? (focusChanged || !ownRecord ? now : ownRecord.focusedAt)
      : 0;

    ownRect = rect;
    ownRecord = {
      id, ...rect, focused, visible, focusedAt,
      heartbeat: now
    };

    localStorage.setItem(WINDOWS_PREFIX + id, JSON.stringify(ownRecord));
    lastHeartbeat = now;
    lastFocusState = focused;
  }

  function readWindows() {
    const now = Date.now();
    const found = [];

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith(WINDOWS_PREFIX)) continue;

      try {
        const entry = JSON.parse(localStorage.getItem(key));
        const valid = entry && typeof entry.id === 'string' &&
          Number.isFinite(entry.x) && Number.isFinite(entry.y) &&
          Number.isFinite(entry.w) && Number.isFinite(entry.h) &&
          entry.w > 0 && entry.h > 0 &&
          Number.isFinite(entry.heartbeat);

        if (!valid || now - entry.heartbeat > WINDOW_TTL_MS) {
          localStorage.removeItem(key);
          continue;
        }
        if (entry.visible !== false) found.push(entry);
      } catch (_) {
        localStorage.removeItem(key);
      }
    }

    return found;
  }

  function electHost(availableWindows) {
    if (!availableWindows.length) return null;

    // The focused page drives physics for responsiveness. If no page currently
    // has focus (for example, another desktop app is selected), elect a stable
    // visible page instead. Every page still renders independently.
    const focused = availableWindows.filter(w => w.focused);
    const candidates = focused.length ? focused : availableWindows;

    candidates.sort((a, b) =>
      (Number(b.focusedAt) || 0) - (Number(a.focusedAt) || 0) ||
      a.id.localeCompare(b.id)
    );
    return candidates[0].id;
  }

  function coveredAt(rects, x, y) {
    const pad = GAP_EDGE_ALLOWANCE;
    return rects.some(r =>
      x >= r.x - pad && x <= r.x + r.w + pad &&
      y >= r.y - pad && y <= r.y + r.h + pad
    );
  }

  function nearestCoveredPoint(rects, x, y) {
    let best = null;
    let bestDistance = Infinity;
    const pad = GAP_EDGE_ALLOWANCE;

    for (const r of rects) {
      const px = Math.max(r.x - pad, Math.min(r.x + r.w + pad, x));
      const py = Math.max(r.y - pad, Math.min(r.y + r.h + pad, y));
      const distance = (px - x) ** 2 + (py - y) ** 2;
      if (distance < bestDistance) {
        bestDistance = distance;
        best = { x: px, y: py };
      }
    }
    return best;
  }

  function createBall(rects, hostId, now) {
    const start = rects.find(r => r.id === hostId) || rects[0];
    return {
      x: start.x + start.w / 2,
      y: start.y + start.h / 2,
      vx: INITIAL_VX,
      vy: INITIAL_VY,
      updated: now
    };
  }

  function readBall() {
    try {
      const value = JSON.parse(localStorage.getItem(BALL_KEY));
      if (value && Number.isFinite(value.x) && Number.isFinite(value.y) &&
          Number.isFinite(value.vx) && Number.isFinite(value.vy) &&
          Number.isFinite(value.updated)) return value;
    } catch (_) {}
    return null;
  }

  function writeBall(next) {
    ballState = next;
    localStorage.setItem(BALL_KEY, JSON.stringify(next));
    lastBallWrite = Date.now();
  }

  function advanceBall(current, rects, now) {
    if (!rects.length) return current;

    let x = current.x;
    let y = current.y;
    let vx = current.vx;
    let vy = current.vy;

    // If a user moves a window away from underneath the ball, the newly
    // uncovered area is a wall. Move the ball to the nearest covered point
    // and reflect it back into the remaining window layout.
    if (!coveredAt(rects, x, y)) {
      const nearest = nearestCoveredPoint(rects, x, y);
      if (!nearest) return current;
      if (nearest.x > x) vx = Math.abs(vx);
      else if (nearest.x < x) vx = -Math.abs(vx);
      if (nearest.y > y) vy = Math.abs(vy);
      else if (nearest.y < y) vy = -Math.abs(vy);
      x = nearest.x;
      y = nearest.y;
    }

    // Time-based physics continues correctly when a background page is
    // throttled and then becomes the driver. Small spatial steps prevent
    // tunnelling through narrow connections or one-pixel gaps.
    const elapsedMs = Math.max(0, Math.min(now - current.updated, 1000));
    const seconds = elapsedMs / 1000;
    const distance = Math.max(Math.abs(vx), Math.abs(vy)) * seconds;
    const steps = Math.max(1, Math.ceil(distance / 0.75));
    const dt = steps ? seconds / steps : 0;

    for (let i = 0; i < steps; i++) {
      const nextX = x + vx * dt;
      if (coveredAt(rects, nextX, y)) {
        x = nextX;
      } else {
        vx = -vx;
      }

      const nextY = y + vy * dt;
      if (coveredAt(rects, x, nextY)) {
        y = nextY;
      } else {
        vy = -vy;
      }
    }

    const speed = Math.hypot(vx, vy);
    if (speed > MAX_SPEED) {
      vx = vx / speed * MAX_SPEED;
      vy = vy / speed * MAX_SPEED;
    }

    return { x, y, vx, vy, updated: now };
  }

  function renderBall() {
    const state = ballState;
    if (!state || !ownRect) {
      ballElement.style.display = 'none';
      return;
    }

    const localX = state.x - ownRect.x;
    const localY = state.y - ownRect.y;
    const intersectsViewport =
      localX + BALL_RADIUS >= 0 && localX - BALL_RADIUS <= ownRect.w &&
      localY + BALL_RADIUS >= 0 && localY - BALL_RADIUS <= ownRect.h;

    if (!intersectsViewport) {
      ballElement.style.display = 'none';
      return;
    }

    ballElement.style.display = 'block';
    ballElement.style.left = (localX - BALL_RADIUS) + 'px';
    ballElement.style.top = (localY - BALL_RADIUS) + 'px';
  }

  function updateStatus(now, hostId) {
    if (now - lastStatusUpdate < 500) return;
    lastStatusUpdate = now;

    const count = windows.length;
    statusElement.textContent = count + ' window' +
      (count === 1 ? '' : 's') + ' connected' +
      (hostId === id ? ' · driving shared physics' : ' · sharing the same ball');

    helpElement.textContent =
      'Open this page in separate browser windows. The ball moves through touching windows and gaps up to one pixel wide. Every window displays the same shared ball; uncovered edges act as walls.';
  }

  function frame() {
    const now = Date.now();

    publishSelf();
    if (now - lastRegistryRead >= REGISTRY_READ_MS) {
      windows = readWindows();
      lastRegistryRead = now;
    }

    const hostId = electHost(windows);

    if (hostId === id) {
      if (!wasHost || !ballState) {
        ballState = readBall();
        lastBallWrite = 0;
      }

      if (!ballState) {
        ballState = createBall(windows, id, now);
        writeBall(ballState);
      } else {
        ballState = advanceBall(ballState, windows, now);
        if (now - lastBallWrite >= BALL_WRITE_MS) writeBall(ballState);
      }
      wasHost = true;
    } else {
      wasHost = false;
      const latest = readBall();
      if (latest) ballState = latest;
    }

    renderBall();
    updateStatus(now, hostId);
    requestAnimationFrame(frame);
  }

  // Storage events make other windows repaint promptly, while each page's
  // animation loop remains independent of focus and of the physics host.
  window.addEventListener('storage', event => {
    if (event.key === BALL_KEY) {
      const latest = readBall();
      if (latest && !wasHost) ballState = latest;
    }
    if (event.key && event.key.startsWith(WINDOWS_PREFIX)) {
      windows = readWindows();
      lastRegistryRead = Date.now();
    }
  });

  window.addEventListener('focus', () => publishSelf(true));
  window.addEventListener('blur', () => publishSelf(true));
  window.addEventListener('resize', () => publishSelf(true));
  window.addEventListener('move', () => publishSelf(true));
  document.addEventListener('visibilitychange', () => publishSelf(true));

  function removeSelf() {
    localStorage.removeItem(WINDOWS_PREFIX + id);
  }
  window.addEventListener('beforeunload', removeSelf);
  window.addEventListener('pagehide', removeSelf);

  // A timer supplements animation-frame sampling for geometry changes while
  // this page is not the selected window. Each instance only writes its own key.
  setInterval(() => {
    publishSelf();
    windows = readWindows();
    lastRegistryRead = Date.now();
  }, HEARTBEAT_MS);

  publishSelf(true);
  windows = readWindows();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
