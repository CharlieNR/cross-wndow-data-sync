<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Ball — Cross-Window Experiment</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, Segoe UI, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10131b; }
  #stage { position: fixed; inset: 0; }
  #ball {
    position: absolute; width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff 0 5%, #ffe08a 12%, #ff9f1c 42%, #e45a13 100%);
    box-shadow: 0 0 18px #ff9f1c99, inset -4px -5px 8px #9c300b66;
    pointer-events: none; z-index: 2;
  }
  #panel {
    position: fixed; left: 12px; top: 12px; z-index: 5; max-width: min(390px, calc(100vw - 24px));
    padding: 11px 14px; border: 1px solid #ffffff24; border-radius: 10px;
    color: #e9edf5; background: #171c29eF; box-shadow: 0 5px 24px #0006;
    font-size: 12px; line-height: 1.45; pointer-events: none;
  }
  #panel strong { color: #fff; font-size: 13px; }
  #status { color: #a9d6ff; }
  #help { color: #aeb8ca; margin-top: 4px; }
</style>
</head>
<body>
<div id="stage"><div id="ball"></div></div>
<div id="panel">
  <strong>Single Ball</strong><br>
  <span id="status">Connecting windows…</span>
  <div id="help">Open this page in separate browser windows, then place their edges directly against one another. The ball crosses only through a shared edge.</div>
</div>
<script>
(() => {
  'use strict';

  const WINDOWS_PREFIX = 'singleball_window_';
  const BALL_KEY = 'singleball_shared_ball_v1';
  const WINDOW_TTL = 15000;
  const HEARTBEAT_MS = 1000;
  const BALL_SIZE = 34;
  const SPEED = 2.7;

  const ballElement = document.getElementById('ball');
  const statusElement = document.getElementById('status');
  const helpElement = document.getElementById('help');

  let id = sessionStorage.getItem('singleball_window_id');
  if (!id) {
    id = 'w_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
    sessionStorage.setItem('singleball_window_id', id);
  }

  let lastFrame = performance.now();
  let lastHeartbeat = 0;
  let lastPosition = '';
  let cachedWindows = [];
  let ball = null;

  function viewportRect() {
    // screenX/screenY describe the outer browser window. Convert to the page viewport.
    const left = window.screenX;
    const top = window.screenY;
    return {
      left, top,
      right: left + window.outerWidth,
      bottom: top + window.outerHeight,
      contentLeft: left + Math.max(0, (window.outerWidth - window.innerWidth) / 2),
      contentTop: top + Math.max(0, window.outerHeight - window.innerHeight),
      width: window.innerWidth,
      height: window.innerHeight
    };
  }

  function readWindows() {
    const now = Date.now();
    const found = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith(WINDOWS_PREFIX)) continue;
      try {
        const entry = JSON.parse(localStorage.getItem(key));
        if (entry && now - entry.heartbeat < WINDOW_TTL) found.push(entry);
        else localStorage.removeItem(key);
      } catch (_) {
        localStorage.removeItem(key);
      }
    }
    return found;
  }

  function heartbeat() {
    const rect = viewportRect();
    const signature = [rect.left, rect.top, rect.width, rect.height].join(':');
    // Always refresh the timestamp; geometry is sampled continuously so moving a window
    // immediately changes which neighbours qualify as connected.
    localStorage.setItem(WINDOWS_PREFIX + id, JSON.stringify({
      id, left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom,
      contentLeft: rect.contentLeft, contentTop: rect.contentTop,
      width: rect.width, height: rect.height, heartbeat: Date.now()
    }));
    if (signature !== lastPosition) {
      lastPosition = signature;
      cachedWindows = readWindows();
    }
    lastHeartbeat = Date.now();
  }

  function getBall() {
    try {
      const value = JSON.parse(localStorage.getItem(BALL_KEY));
      if (value && value.owner && Number.isFinite(value.x) && Number.isFinite(value.y)) return value;
    } catch (_) {}
    return null;
  }

  function saveBall(next) {
    next.updated = Date.now();
    localStorage.setItem(BALL_KEY, JSON.stringify(next));
    ball = next;
  }

  function ensureBall() {
    ball = getBall();
    if (!ball) {
      const x = Math.max(0, (window.innerWidth - BALL_SIZE) / 2);
      const y = Math.max(0, (window.innerHeight - BALL_SIZE) / 2);
      saveBall({ owner: id, x, y, vx: SPEED, vy: SPEED * 0.72, updated: Date.now() });
    }
  }

  function nearlyEqual(a, b, tolerance) {
    return Math.abs(a - b) <= tolerance;
  }

  function findNeighbour(edge, ballCentre) {
    const here = viewportRect();
    const others = readWindows().filter(w => w.id !== id);

    for (const other of others) {
      let touches = false;
      let targetX = 0;
      let targetY = 0;
      if (edge === 'right') {
        const overlapStart = Math.max(here.contentTop, other.contentTop);
        const overlapEnd = Math.min(here.contentTop + here.height, other.contentTop + other.height);
        touches = nearlyEqual(here.right, other.left, 3) &&
          overlapEnd > overlapStart && ballCentre >= overlapStart && ballCentre <= overlapEnd;
        if (touches) {
          targetX = 1;
          targetY = ballCentre - other.contentTop - BALL_SIZE / 2;
        }
      } else if (edge === 'left') {
        const overlapStart = Math.max(here.contentTop, other.contentTop);
        const overlapEnd = Math.min(here.contentTop + here.height, other.contentTop + other.height);
        touches = nearlyEqual(here.left, other.right, 3) &&
          overlapEnd > overlapStart && ballCentre >= overlapStart && ballCentre <= overlapEnd;
        if (touches) {
          targetX = other.width - BALL_SIZE - 1;
          targetY = ballCentre - other.contentTop - BALL_SIZE / 2;
        }
      } else if (edge === 'bottom') {
        const overlapStart = Math.max(here.contentLeft, other.contentLeft);
        const overlapEnd = Math.min(here.contentLeft + here.width, other.contentLeft + other.width);
        touches = nearlyEqual(here.bottom, other.top, 3) &&
          overlapEnd > overlapStart && ballCentre >= overlapStart && ballCentre <= overlapEnd;
        if (touches) {
          targetX = ballCentre - other.contentLeft - BALL_SIZE / 2;
          targetY = 1;
        }
      } else if (edge === 'top') {
        const overlapStart = Math.max(here.contentLeft, other.contentLeft);
        const overlapEnd = Math.min(here.contentLeft + here.width, other.contentLeft + other.width);
        touches = nearlyEqual(here.top, other.bottom, 3) &&
          overlapEnd > overlapStart && ballCentre >= overlapStart && ballCentre <= overlapEnd;
        if (touches) {
          targetX = ballCentre - other.contentLeft - BALL_SIZE / 2;
          targetY = other.height - BALL_SIZE - 1;
        }
      }
      if (touches) return { window: other, x: targetX, y: targetY };
    }
    return null;
  }

  function keepInside(value, max) {
    return Math.max(0, Math.min(Math.max(0, max), value));
  }

  function step(delta) {
    // The focused window drives the shared simulation, even when the ball's
    // logical owner is a background window. Background requestAnimationFrame
    // loops are commonly throttled by browsers.
    if (document.visibilityState !== 'visible' || !document.hasFocus()) return;

    const shared = getBall();
    if (!shared) return;

    const windows = readWindows();
    let ownerWindow = windows.find(w => w.id === shared.owner);
    if (!ownerWindow) {
      ownerWindow = windows.find(w => w.id === id);
      if (!ownerWindow) return;
      saveBall({ ...shared, owner: id,
        x: keepInside(shared.x, ownerWindow.width - BALL_SIZE),
        y: keepInside(shared.y, ownerWindow.height - BALL_SIZE) });
    }

    const dt = Math.min(delta, 32) / 16.67;
    const oldCentreX = ownerWindow.contentLeft + shared.x + BALL_SIZE / 2;
    const oldCentreY = ownerWindow.contentTop + shared.y + BALL_SIZE / 2;
    let nextCentreX = oldCentreX + shared.vx * dt;
    let nextCentreY = oldCentreY + shared.vy * dt;

    const contains = (w, cx, cy) =>
      cx >= w.contentLeft && cx <= w.contentLeft + w.width &&
      cy >= w.contentTop && cy <= w.contentTop + w.height;

    // Prefer the focused window whenever the ball is inside its viewport.
    // This makes overlap a valid transfer area and keeps the ball visible
    // above background windows.
    const focusedWindow = windows.find(w => w.id === id);
    let destination = focusedWindow && contains(focusedWindow, nextCentreX, nextCentreY)
      ? focusedWindow
      : (contains(ownerWindow, nextCentreX, nextCentreY) ? ownerWindow : null);

    // If the ball has left its current window, look for any other live
    // viewport containing its new position. This handles touching and
    // overlapping windows without requiring exact edge alignment.
    if (!destination) {
      destination = windows.find(w => w.id !== ownerWindow.id &&
        contains(w, nextCentreX, nextCentreY)) || null;
    }

    if (!destination) {
      // No other window covers the ball's next position: the current
      // window's boundary is a wall.
      const minX = ownerWindow.contentLeft + BALL_SIZE / 2;
      const maxX = ownerWindow.contentLeft + ownerWindow.width - BALL_SIZE / 2;
      const minY = ownerWindow.contentTop + BALL_SIZE / 2;
      const maxY = ownerWindow.contentTop + ownerWindow.height - BALL_SIZE / 2;

      if (nextCentreX < minX) {
        nextCentreX = minX + (minX - nextCentreX);
        shared.vx = Math.abs(shared.vx);
      } else if (nextCentreX > maxX) {
        nextCentreX = maxX - (nextCentreX - maxX);
        shared.vx = -Math.abs(shared.vx);
      }
      if (nextCentreY < minY) {
        nextCentreY = minY + (minY - nextCentreY);
        shared.vy = Math.abs(shared.vy);
      } else if (nextCentreY > maxY) {
        nextCentreY = maxY - (nextCentreY - maxY);
        shared.vy = -Math.abs(shared.vy);
      }
      destination = ownerWindow;
    }

    const next = {
      ...shared,
      owner: destination.id,
      x: keepInside(nextCentreX - destination.contentLeft - BALL_SIZE / 2,
        destination.width - BALL_SIZE),
      y: keepInside(nextCentreY - destination.contentTop - BALL_SIZE / 2,
        destination.height - BALL_SIZE),
      updated: Date.now()
    };

    localStorage.setItem(BALL_KEY, JSON.stringify(next));
    ball = next;

    if (destination.id === id) {
      ballElement.style.display = 'block';
      ballElement.style.left = next.x + 'px';
      ballElement.style.top = next.y + 'px';
    } else {
      ballElement.style.display = 'none';
    }
  }

  function updateStatus() {
    cachedWindows = readWindows();
    const count = cachedWindows.length;
    statusElement.textContent = count + ' window' + (count === 1 ? '' : 's') + ' connected' +
      (ball && ball.owner === id ? ' · ball is here' : ' · ball is in another window');
    helpElement.textContent = 'The ball can move between touching or overlapping windows. The focused window keeps the simulation running even when the ball is in a background window.';
  }

  function animate(now) {
    const delta = now - lastFrame;
    lastFrame = now;
    step(delta);
    requestAnimationFrame(animate);
  }

  heartbeat();
  ensureBall();
  setInterval(() => {
    heartbeat();
    updateStatus();
    // Recover if the window currently owning the ball was closed.
    const current = getBall();
    if (current && current.owner !== id) {
      const liveWindows = readWindows();
      const ownerAlive = liveWindows.some(w => w.id === current.owner);
      const electedWindow = liveWindows.map(w => w.id).sort()[0];
      if (!ownerAlive && electedWindow === id && Date.now() - current.updated > 600) {
        saveBall({ ...current, owner: id,
          x: keepInside(current.x, window.innerWidth - BALL_SIZE),
          y: keepInside(current.y, window.innerHeight - BALL_SIZE) });
      }
    }
  }, HEARTBEAT_MS);

  window.addEventListener('storage', event => {
    if (event.key === BALL_KEY) {
      ball = getBall();
      if (ball && ball.owner !== id) ballElement.style.display = 'none';
    }
  });
  window.addEventListener('beforeunload', () => localStorage.removeItem(WINDOWS_PREFIX + id));
  window.addEventListener('resize', heartbeat);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
